# Local development bench. Every credential here is a local development value.
# ChirpStack, gateway bridge, Mosquitto, Redis and PostgreSQL services are based
# on chirpstack/chirpstack-docker (MIT).

x-python: &python
  build: .
  image: eng-iot-telemetry-pipeline:local

services:
  chirpstack:
    image: chirpstack/chirpstack:4.20.0
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      # The prefix is the region id (REGION, default eu868) and must match the ChirpStack region file.
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=${REGION:-eu868}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=${REGION:-eu868}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=${REGION:-eu868}/gateway/{{ .GatewayID }}/command/#
    depends_on:
      mosquitto:
        condition: service_healthy

  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - ./sql/schema.sql:/schema/schema.sql:ro
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chirpstack -d telemetry"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20

  influxdb:
    image: influxdb:2.8.0-alpine
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=local-dev-password
      - DOCKER_INFLUXDB_INIT_ORG=local-org
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=local-dev-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.4.15
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    environment:
      # Local development only: default admin/admin login.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=light
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ingest:
    <<: *python
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto
      - POSTGRES_DSN=postgresql://chirpstack:chirpstack@postgres:5432/telemetry
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=local-dev-token
      - INFLUX_ORG=local-org
      - INFLUX_BUCKET=telemetry

  # Counts the frames each gateway hands to the bridge (radio side), independent of ingest.
  gateway-tap:
    <<: *python
    restart: unless-stopped
    command: ["python", "-m", "gateway_tap.service"]
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto
      - GATEWAY_TOPIC_PREFIX=${REGION:-eu868}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=local-dev-token
      - INFLUX_ORG=local-org
      - INFLUX_BUCKET=telemetry

  # One-shot tools: run with "docker compose run --rm <name>" (profile tools).
  provision:
    <<: *python
    profiles: ["tools"]
    command: ["python", "-m", "provision.provision"]
    environment:
      - CHIRPSTACK_API=chirpstack:8080
      - REGION=${REGION:-eu868}
    depends_on:
      - chirpstack

  simulator:
    <<: *python
    profiles: ["tools"]
    command: ["python", "-m", "simulator.run"]
    environment:
      - BRIDGE_HOST=chirpstack-gateway-bridge
      - BRIDGE_PORT=1700
      - REGION=${REGION:-eu868}

  approve:
    <<: *python
    profiles: ["tools"]
    command: ["python", "-m", "approve.run"]
    environment:
      - POSTGRES_DSN=postgresql://chirpstack:chirpstack@postgres:5432/telemetry

volumes:
  postgresqldata:
  redisdata:
  influxdata:
  grafanadata:
