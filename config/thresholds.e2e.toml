# send every 2 s or so, stay well under it.

min_uplinks = 5
max_fcnt_missing = 0
max_interval_s = 5
rssi_min_dbm = -110
rssi_median_min_dbm = -105
battery_min_mv = 3000
battery_max_drop_mv = 200
