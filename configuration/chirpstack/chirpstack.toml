# Based on chirpstack/chirpstack-docker (MIT). Local development only.

[logging]
  level="info"

[postgresql]
  dsn="postgres://chirpstack:chirpstack@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0

[redis]
  servers=[
    "redis://$REDIS_HOST/",
  ]
  tls_enabled=false
  cluster=false

[network]
  net_id="000000"

  # Both regions are enabled and each one has its own gateway topic prefix (its id), so
  # the region in use is chosen by the prefix of the gateway bridge (REGION in docker-compose.yml)
  # and by the region of the device profile. ChirpStack cannot switch the list by environment.
  enabled_regions=[
    "eu868",
    "au915_0",
  ]

[api]
  bind="0.0.0.0:8080"
  # Local development only: replace for anything but a laptop bench.
  secret="local-development-only-not-a-secret"

[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    # JSON events on application/{app_id}/device/{dev_eui}/event/{event}.
    json=true
    # QoS 1 so that events wait in the broker for the ingest service's persistent session
    # while it is down (a QoS 0 publish is simply dropped for an offline subscriber).
    qos=1
