# Local development only: anonymous access, no TLS.
listener 1883
allow_anonymous true

# Messages queued for an offline client with a persistent session (the ingest service).
# The default is 1000 per client.
max_queued_messages 10000

# Keep the persistent sessions and their queued messages across a broker restart: the
# volume mosquittodata is mounted at /mosquitto/data (docker-compose.yml).
persistence true
persistence_location /mosquitto/data/
# Without this the broker writes only at a clean stop and every 1800 s; a kill or an OOM would
# lose the whole queue. With 30 s it loses at most 30 s of it.
autosave_interval 30
